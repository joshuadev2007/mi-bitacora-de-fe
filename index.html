<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d4037" />
  <meta name="description" content="Tu espacio personal para estudiar, agradecer, orar y registrar tu camino de fe." />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Mi Bitácora de Fe · Edición 3.1 · Lector y actualizaciones</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#inicio" data-view="inicio" aria-label="Ir al inicio">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text"><b>Mi Bitácora</b><small>DE FE · UN CAMINO PERSONAL</small></span>
      </a>
      <div class="sidebar-caption">MI ESPACIO</div>
      <nav class="nav-list" id="desktop-nav"></nav>
      <div class="sidebar-bottom">
        <div class="soft-quote"><span class="tiny-sparkle">✧</span><p>“Un lugar para preguntar, descubrir y crecer.”</p></div>
        <button class="settings-link" data-view="ajustes" type="button"><span data-icon="settings"></span> Ajustes <span class="chevron">›</span></button>
        <div class="sidebar-footer">Hecho para tu camino <span>♡</span></div>
      </div>
    </aside>
    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir menú" type="button"><span data-icon="menu"></span></button><span id="breadcrumb">TU SANTUARIO DIGITAL</span></div>
        <div class="topbar-actions"><span class="local-indicator" title="Tus datos se guardan en este navegador"><span class="indicator-dot"></span> Guardado local</span><button class="icon-button theme-toggle" id="theme-toggle" title="Cambiar modo claro/oscuro" aria-label="Cambiar tema" type="button"><span data-icon="moon"></span></button><button class="round-avatar" id="avatar-action" title="Personalizar tu espacio" aria-label="Personalizar tu espacio" type="button">✦</button></div>
      </header>
      <main class="main-content" id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <nav class="mobile-bottom-nav" id="mobile-nav" aria-label="Navegación móvil"></nav>
  <div class="mobile-scrim" id="mobile-scrim"></div>
  <dialog id="app-dialog" class="app-dialog" aria-labelledby="modal-title"><div id="dialog-body"></div></dialog>
  <div id="toast-area" class="toast-area" role="status" aria-live="polite"></div>
  <script src="./mis-libros.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
